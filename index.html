<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Enlaces y Códigos QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Importamos las credenciales desde el archivo .js externo -->
  <script src="config.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- VISTA DE LOGIN -->
  <div id="loginSection" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Panel Administrador</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="userInput" required class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="passInput" required class="w-full mt-1 p-2 border rounded focus:ring-blue-500 focus:border-blue-500">
        </div>
        <p id="loginError" class="text-red-500 text-sm hidden">Usuario o contraseña incorrectos</p>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div id="adminSection" class="hidden container mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Administración de Enlaces y Códigos QR</h1>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Cerrar Sesión</button>
    </div>

    <!-- FORMULARIO CREAR ENLACE -->
    <div class="bg-white p-6 rounded-lg shadow mb-8">
      <h3 class="text-lg font-semibold mb-4">Crear Nuevo Enlace y QR</h3>
      <form onsubmit="createLink(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="url" id="targetUrl" placeholder="URL Destino (https://...)" required class="p-2 border rounded">
        <input type="text" id="shortCode" placeholder="Código corto (Opcional)" class="p-2 border rounded">
        <input type="text" id="notes" placeholder="Notas o Descripción" class="p-2 border rounded">
        <button type="submit" class="md:col-span-3 bg-green-600 text-white py-2 rounded font-semibold hover:bg-green-700">Guardar en Google Sheets y Generar</button>
      </form>
    </div>

    <!-- TABLA DE GESTIÓN -->
    <div class="bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b">
            <th class="p-4">Código Corto</th>
            <th class="p-4">URL Destino</th>
            <th class="p-4">Clics</th>
            <th class="p-4">Notas</th>
            <th class="p-4">QR</th>
            <th class="p-4">Acciones</th>
          </tr>
        </thead>
        <tbody id="linksTableBody">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL MOSTRAR QR -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg text-center max-w-sm w-full">
      <h3 class="text-lg font-bold mb-4">Código QR del Enlace</h3>
      <div id="qrcode" class="flex justify-center mb-4"></div>
      <button onclick="closeQrModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Cerrar</button>
    </div>
  </div>

  <script>
    let isLoggedIn = localStorage.getItem("is_logged_in") === "true";

    window.onload = () => {
      if (isLoggedIn) showAdminPanel();
    };

    async function apiRequest(payload) {
      try {
        const response = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const textData = await response.text();
        return JSON.parse(textData);
      } catch (error) {
        console.error("Error de conexión:", error);
        return { success: false, error: "No se pudo comunicar con Google Sheets." };
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById("userInput").value;
      const pass = document.getElementById("passInput").value;

      if (user === CONFIG.ADMIN_USER && pass === CONFIG.ADMIN_PASS) {
        isLoggedIn = true;
        localStorage.setItem("is_logged_in", "true");
        showAdminPanel();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function logout() {
      localStorage.removeItem("is_logged_in");
      isLoggedIn = false;
      location.reload();
    }

    function showAdminPanel() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("adminSection").classList.remove("hidden");
      loadLinks();
    }

    async function loadLinks() {
      const res = await apiRequest({ action: "list" });
      if (res.success) {
        const tbody = document.getElementById("linksTableBody");
        tbody.innerHTML = "";
        res.data.forEach(link => {
          const redirectUrl = `${CONFIG.SCRIPT_URL}?r=${link.shortCode}`;
          tbody.innerHTML += `
            <tr class="border-b hover:bg-gray-50">
              <td class="p-4 font-mono text-blue-600"><a href="${redirectUrl}" target="_blank">${link.shortCode}</a></td>
              <td class="p-4 truncate max-w-xs">${link.targetUrl}</td>
              <td class="p-4 font-semibold">${link.clicks}</td>
              <td class="p-4">${link.notes}</td>
              <td class="p-4">
                <button onclick="showQR('${redirectUrl}')" class="bg-indigo-500 text-white px-3 py-1 rounded text-sm">Ver QR</button>
              </td>
              <td class="p-4 space-x-2">
                <button onclick="editLink('${link.id}', '${link.targetUrl}', '${link.notes}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-sm">Editar</button>
                <button onclick="deleteLink('${link.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-sm">Eliminar</button>
              </td>
            </tr>
          `;
        });
      }
    }

    async function createLink(e) {
      e.preventDefault();
      const targetUrl = document.getElementById("targetUrl").value;
      const shortCode = document.getElementById("shortCode").value;
      const notes = document.getElementById("notes").value;

      const res = await apiRequest({ action: "create", targetUrl, shortCode, notes });
      if (res.success) {
        document.getElementById("targetUrl").value = "";
        document.getElementById("shortCode").value = "";
        document.getElementById("notes").value = "";
        loadLinks();
      } else {
        alert("Error: " + res.error);
      }
    }

    async function editLink(id, currentUrl, currentNotes) {
      const newUrl = prompt("Nueva URL Destino:", currentUrl);
      const newNotes = prompt("Nuevas Notas:", currentNotes);
      if (newUrl) {
        await apiRequest({ action: "update", id, targetUrl: newUrl, notes: newNotes });
        loadLinks();
      }
    }

    async function deleteLink(id) {
      if (confirm("¿Estás seguro de eliminar este enlace?")) {
        await apiRequest({ action: "delete", id });
        loadLinks();
      }
    }

    function showQR(url) {
      const container = document.getElementById("qrcode");
      container.innerHTML = "";
      new QRCode(container, { text: url, width: 180, height: 180 });
      document.getElementById("qrModal").classList.remove("hidden");
    }

    function closeQrModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }
  </script>
</body>
</html>
